name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  quality:
    name: Typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          # pnpm is provided by Corepack in the next step; setup-node's package-manager
          # cache probes for the binary first and fails when it is not there yet.
          package-manager-cache: false

      - name: Enable Corepack (pnpm from package.json#packageManager)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  container:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build image (not pushed)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          tags: deployalign:ci

  action:
    name: Action self-test on the examples
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compile the hospital example (expected to fail the verdict)
        id: hospital
        uses: ./
        continue-on-error: true
        with:
          path: examples/hospital-delivery-robot
          fail-on: blocker
          out: deployalign-out/hospital

      - name: Assert the hospital verdict
        shell: bash
        run: |
          test "${{ steps.hospital.outcome }}" = "failure"
          test "${{ steps.hospital.outputs.verdict }}" = "FAIL"
          test "${{ steps.hospital.outputs.gate }}" = "HOLD"
          test "${{ steps.hospital.outputs.blockers }}" = "4"
          test "${{ steps.hospital.outputs.warnings }}" = "1"
          test -f deployalign-out/hospital/report.md
          grep -q "DA-001 UNBOUNDED_SCOPE" deployalign-out/hospital/report.md

      - name: Compile the warehouse example (expected to pass)
        id: warehouse
        uses: ./
        with:
          path: examples/warehouse-amr
          fail-on: warning
          out: deployalign-out/warehouse

      - name: Compile the Korean example (expected to fail the verdict)
        id: korean
        uses: ./
        continue-on-error: true
        with:
          path: examples/sub-fab-raman-ko
          out: deployalign-out/korean

      - name: Assert the warehouse and Korean verdicts
        shell: bash
        run: |
          test "${{ steps.warehouse.outputs.verdict }}" = "PASS"
          test "${{ steps.warehouse.outputs.blockers }}" = "0"
          test "${{ steps.korean.outcome }}" = "failure"
          test "${{ steps.korean.outputs.blockers }}" = "4"
          grep -q "12곳의 핵심 구역" deployalign-out/korean/report.md
